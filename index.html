<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Murstenshus — 3D Web App</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #app { position: fixed; inset: 0; }
    #compare {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 50%;
      border-left: 3px solid #fff;
      box-shadow: -6px 0 20px rgba(0,0,0,0.35);
      display: none;
      overflow: hidden;
    }
    #compare img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      pointer-events: none;
    }
    #compare .label {
      position: absolute;
      bottom: 12px;
      right: 14px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      pointer-events: none;
    }
    #toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      border: 0;
      background: rgba(255,255,255,0.9);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }
    #toggle:hover { background: #fff; }
    #overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      user-select: none;
    }
    #overlay h1 { margin: 0; font-size: 18px; color: #222; }
    #overlay p { margin: 4px 0 0; font-size: 13px; color: #555; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="compare">
    <img src="./assets/reference.jpg" alt="Referencebillede af huset" />
    <span class="label">Referencebillede</span>
  </div>
  <button id="toggle">Sammenlign med billede</button>
  <div id="overlay">
    <h1>Murstenshus i 3D</h1>
    <p>Træk for at dreje rundt &middot; scroll for zoom &middot; højreklik for at panorere</p>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
