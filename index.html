<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Murstenshus — 3D Web App</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #app { position: fixed; inset: 0; }
    #overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      user-select: none;
    }
    #overlay h1 { margin: 0; font-size: 18px; color: #222; }
    #overlay p { margin: 4px 0 0; font-size: 13px; color: #555; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">
    <h1>Murstenshus i 3D</h1>
    <p>Træk for at dreje rundt &middot; scroll for zoom &middot; højreklik for at panorere</p>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
